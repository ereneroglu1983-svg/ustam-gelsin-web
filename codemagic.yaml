workflows:
  ios-paid-release:
    name: HUG - iOS Release PAID - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.32.8
      xcode: 16.2
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.ustamgelsin.app.ustamgelsin"
    scripts:
      - name: 1. Flutter clean & pub get
        script: |
          flutter clean
          flutter pub get

      - name: 2. Verify PAID Bundle ID - lowercase + DisplayName
        script: |
          set -e
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          grep -q "com.ustamgelsin.app.ustamgelsin" "$PBX" || { echo "❌ Bundle ID lowercase olmalı"; exit 1; }
          if grep -q "com.ustamgelsin.app.ustamGelsin" "$PBX"; then echo "❌ Büyük G bulundu!"; exit 1; fi
          INFO="ios/Runner/Info.plist"
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO")
          [ "$DISPLAY_NAME" = "Hemen Ustam Gelsin" ] || { echo "❌ DisplayName Hemen Ustam Gelsin olmalı"; exit 1; }
          echo "✅ Bundle ID ve DisplayName OK"

      - name: 3. Verify Firebase GoogleService-Info.plist Bundle ID
        script: |
          set -e
          EXPECTED="com.ustamgelsin.app.ustamgelsin"
          PLIST_PATH="ios/Runner/GoogleService-Info.plist"
          [ -f "$PLIST_PATH" ] || { echo "❌ GoogleService-Info.plist yok"; exit 1; }
          PLIST_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$PLIST_PATH")
          [ "$PLIST_BUNDLE" = "$EXPECTED" ] || { echo "❌ Firebase BUNDLE_ID mismatch: $PLIST_BUNDLE"; exit 1; }
          echo "✅ Firebase plist OK: $PLIST_BUNDLE"

      - name: 4. FORCE Podfile iOS 15.0 - keep lock
        script: |
          set -e
          cat > ios/Podfile <<'PODFILE'
          platform :ios, '15.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist"
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          PODFILE

      - name: 5. Pod install - keep Podfile.lock
        script: |
          set -e
          cd ios
          rm -rf Pods
          pod install --repo-update

      - name: 6. Set up keychain and fetch signing files
        script: |
          set -e

          echo "=== INITIALIZE KEYCHAIN ==="
          keychain initialize

          echo "=== DEBUG ENV VARS (names only) ==="
          env | grep -E "ISSUER_ID|KEY_IDENTIFIER|PRIVATE_KEY|CERTIFICATE" | cut -d= -f1 | sort || true

          echo "=== FETCH APP STORE SIGNING FILES ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create

          echo "=== IMPORT CERTIFICATES ==="
          keychain add-certificates

          echo "=== CHECK CODE SIGNING IDENTITIES ==="
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning 2>&1)"
          echo "$IDENTITY_OUTPUT"

          if ! echo "$IDENTITY_OUTPUT" | grep -Eq '[1-9][0-9]* valid identities found'; then
            echo "❌ Geçerli Apple signing identity bulunamadı"
            exit 1
          fi

          echo "=== CHECK PROVISIONING PROFILES ==="
          find "$HOME/Library/MobileDevice/Provisioning Profiles" -maxdepth 1 -type f -print 2>/dev/null || true
          ls -lh "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || true

          echo "=== APPLY SIGNING TO RUNNER PROJECT ==="
          xcode-project use-profiles --project ios/Runner.xcodeproj

          echo "=== SIGNING CONFIGURATION COMPLETED ==="

      - name: 7. Build IPA Release App Store
        script: |
          set -e
          flutter build ipa --release --export-method app-store --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - HUG Testers