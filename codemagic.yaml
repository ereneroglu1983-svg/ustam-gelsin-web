workflows:
  ios-free-development:
    name: iOS - Free Development (No Paid Apple Account)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.32.0
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Flutter version
        script: |
          flutter --version
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Pod install (iOS dependencies)
        script: |
          cd ios && pod install --repo-update || echo "Pod install skipped - using SPM"
      - name: Flutter analyze (check iOS compatibility)
        script: |
          flutter analyze --no-fatal-infos
      - name: Build iOS App (No Codesign - Free Apple ID)
        script: |
          flutter build ios --debug --no-codesign --verbose
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/iphoneos/**/*.app
      - build/**/*.log
      - flutter_*.log

  ios-testflight-paid:
    name: iOS - TestFlight (Requires Paid Apple Developer 99$)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.32.0
      xcode: 16.2
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.ustamgelsin.app.ustamGelsin"
        APPLE_TEAM_ID: "YOUR_TEAM_ID_HERE"
    scripts:
      - name: Set up keychain and provisioning profiles
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS IPA for TestFlight
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/export_options.plist
    publishing:
      - name: Publish to App Store Connect / TestFlight
        script: |
          app-store-connect publish --path $(find build/ios/ipa -name "*.ipa" | head -n 1)
